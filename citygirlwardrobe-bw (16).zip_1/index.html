<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CityGirl Wardrobe | Dressed to Match the City</title>
<meta name="description" content="CityGirl Wardrobe — feminine, fun clothing and accessories for the girl who runs the city. Shop dresses, sets, tops, bottoms and accessories. We ship worldwide.">
<link rel="icon" href="assets/img/logo.png">
<link rel="stylesheet" href="assets/css/style.css">
<noscript><style>[data-reveal]{opacity:1!important;transform:none!important;}.hero-title,.hero-actions{opacity:1!important;transform:none!important;}.hero-full .hero-bg{opacity:1!important;}</style></noscript>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
</head>
<body class="home">
<a class="skip-link" href="#main">Skip to content</a>

<div id="announcement-bar" class="announcement-bar"></div>
<header class="site-header" id="site-header"></header>

<main id="main">

  <!-- FULL-BLEED HERO -->
  <section class="hero hero-full">
    <div class="hero-fill" id="hero-fill" aria-hidden="true"></div>
    <video class="hero-bg" id="hero-video" autoplay muted loop playsinline preload="auto" poster="assets/img/hero-poster.jpg">
      <source src="assets/img/hero-citygirl.mp4" type="video/mp4">
    </video>
    <div class="hero-scrim" aria-hidden="true"></div>
    <div class="hero-full-inner">
      <h1 class="hero-title" id="hero-heading">City Girl Energy. Dressed to Match.</h1>
      <div class="hero-actions">
        <a href="shop.html?filter=new" class="btn btn-primary btn-on-dark" id="hero-cta">Shop New In</a>
        <a href="shop.html?filter=bestsellers" class="btn btn-light" id="hero-cta2">Shop Bestsellers</a>
      </div>
    </div>
  </section>

  <!-- COLLECTIONS -->
  <section class="home-section" aria-label="Collections">
    <div class="rail rail-collections rail-split" id="collections-top"></div>
  </section>

  <!-- SHIPPING STRIP -->
  <div class="marquee" role="note" aria-label="We ship worldwide. Lagos delivery in 1–3 days. Free Lagos delivery over ₦50,000.">
    <div class="marquee-track" aria-hidden="true">
      <span>We ship worldwide</span><span>Lagos delivery in 1–3 days</span><span>Free Lagos delivery over ₦50,000</span>
      <span>We ship worldwide</span><span>Lagos delivery in 1–3 days</span><span>Free Lagos delivery over ₦50,000</span>
    </div>
  </div>

  <!-- BEST SELLERS -->
  <section class="home-section">
    <div class="container"><h2 class="section-title">Best Sellers</h2></div>
    <div class="rail rail-products" id="bestseller-rail"></div>
  </section>

  <!-- SHOP BY CATEGORY -->
  <section class="home-section" aria-label="Shop by category">
    <div class="rail rail-collections" id="collections-categories"></div>
  </section>

  <!-- NEW IN -->
  <section class="home-section">
    <div class="container"><h2 class="section-title">New In</h2></div>
    <div class="rail rail-products" id="newin-rail"></div>
  </section>

  <!-- REVIEWS -->
  <section class="home-section" id="reviews-section">
    <div class="container"><h2 class="section-title">Reviews</h2></div>
    <div class="rail rail-reviews" id="reviews-rail"></div>
  </section>

  <!-- INSTAGRAM -->
  <section class="home-section">
    <div class="container"><h2 class="section-title"><a href="#" id="ig-follow" target="_blank" rel="noopener">@<span id="ig-handle">shopcitygirlng</span></a></h2></div>
    <div class="rail rail-insta" id="insta-rail"></div>
  </section>

</main>

<footer class="site-footer" id="site-footer"></footer>

<div id="newsletter-modal-root"></div>
<div id="bag-drawer-root"></div>
<div id="quickview-modal-root"></div>

<button class="back-to-top" aria-label="Back to top">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<script src="assets/js/store-data.js"></script>
<script src="assets/js/render.js"></script>
<script>
  CGWRender.init('index.html');
  var content = CGWRender.content;
  var esc = CGWRender.escapeHtml;

  document.getElementById('hero-heading').textContent = content.hero.heading;

  // Hero media: video by default; if the owner set a custom hero image in Admin,
  // show that image instead.
  var customImage = content.hero.image && content.hero.image !== 'assets/img/hero-red-dress.jpg';
  var videoEl = document.getElementById('hero-video');
  // Blurred backdrop fills the gaps while the media loads.
  var fillEl = document.getElementById('hero-fill');
  if (fillEl) fillEl.style.backgroundImage = 'url("' + (customImage ? content.hero.image : (content.hero.poster || 'assets/img/hero-poster.jpg')) + '")';
  if (customImage && videoEl) {
    var img = document.createElement('img');
    img.className = 'hero-bg';
    img.id = 'hero-video';
    img.src = content.hero.image;
    img.alt = 'CityGirl Wardrobe';
    img.onerror = function () { this.onerror = null; this.src = 'assets/img/hero-red-dress.jpg'; };
    videoEl.parentNode.replaceChild(img, videoEl);
  } else if (videoEl && content.hero.video) {
    var src = videoEl.querySelector('source');
    if (src && src.getAttribute('src') !== content.hero.video) { src.setAttribute('src', content.hero.video); videoEl.load(); }
    if (content.hero.poster) videoEl.setAttribute('poster', content.hero.poster);
  }

  // CTAs
  var cta = document.getElementById('hero-cta');
  cta.textContent = content.hero.buttonText; cta.href = content.hero.buttonLink;
  var cta2 = document.getElementById('hero-cta2');
  if (content.hero.buttonText2) { cta2.textContent = content.hero.buttonText2; cta2.href = content.hero.buttonLink2 || 'shop.html?filter=bestsellers'; }
  else cta2.hidden = true;

  // ---- Product-dependent sections (built once, after trying live data) ----
  function newIn() {
    var list = content.products.filter(function (p) { return p.tag === 'New'; });
    return list.length ? list : content.products.slice(0, 6);
  }
  function bestsellers() {
    var list = content.products.filter(CGWRender.isBestseller);
    return list.length ? list : content.products.slice(0, 6);
  }

  // Cover photo for a collection card — prefer a product not already used as a cover.
  function coverFrom(list, used) {
    var pick = list.find(function (p) { return p.image && used.indexOf(p.image) === -1; }) || list[0];
    if (!pick) return null;
    used.push(pick.image);
    return pick.image;
  }

  function buildCollections() {
    var used = [];
    var top = [
      { title: 'New In', href: 'shop.html?filter=new', image: coverFrom(newIn(), used) },
      { title: 'Trending', href: 'shop.html?filter=bestsellers', image: coverFrom(bestsellers(), used) }
    ].filter(function (c) { return c.image; });
    document.getElementById('collections-top').innerHTML = top.map(CGWRender.collectionCardHtml).join('');

    var cats = content.categories.map(function (c) {
      var inCat = content.products.filter(function (p) { return p.category === c; });
      return inCat.length ? { title: c, href: 'shop.html?cat=' + encodeURIComponent(c), image: coverFrom(inCat, used) } : null;
    }).filter(Boolean);
    document.getElementById('collections-categories').innerHTML = cats.map(CGWRender.collectionCardHtml).join('');
  }

  function buildProductRails() {
    document.getElementById('bestseller-rail').innerHTML = bestsellers().slice(0, 10).map(CGWRender.productCardHtml).join('');
    document.getElementById('newin-rail').innerHTML = newIn().slice(0, 10).map(CGWRender.productCardHtml).join('');
  }

  function buildReviews() {
    var reviews = content.reviews || [];
    if (!reviews.length) { document.getElementById('reviews-section').hidden = true; return; }
    document.getElementById('reviews-rail').innerHTML = reviews.map(function (r) {
      return '<div class="review-card">' +
        '<div class="review-stars">' + CGWRender.starsHtml(r.rating || 5, 0) + '</div>' +
        '<p class="review-text">“' + esc(r.text) + '”</p>' +
        '<div class="review-meta"><b>' + esc(r.name) + '</b>' + (r.product ? '<span>' + esc(r.product) + '</span>' : '') + '</div>' +
      '</div>';
    }).join('');
  }

  function buildInstagram() {
    var handle = content.meta.instagram;
    var igUrl = 'https://instagram.com/' + encodeURIComponent(handle);
    document.getElementById('ig-handle').textContent = handle;
    document.getElementById('ig-follow').href = igUrl;
    var gallery = (content.gallery && content.gallery.length) ? content.gallery :
      ['fashion,street', 'model,style', 'outfit,woman', 'dress,fashion', 'accessories,style', 'lookbook,fashion', 'runway,fashion', 'portrait,style']
        .map(function (kw, i) { return 'https://loremflickr.com/500/500/' + kw + '/all?lock=' + (60 + i); });
    document.getElementById('insta-rail').innerHTML = gallery.map(function (src) {
      return '<a class="insta-cell" href="' + igUrl + '" target="_blank" rel="noopener" aria-label="Instagram">' +
        '<img src="' + esc(src) + '" alt="" loading="lazy" onerror="this.onerror=null;this.src=\'assets/img/product-fallback.jpg\'">' +
      '</a>';
    }).join('');
  }

  // Pull live data from Supabase when available, then build the sections. Falls
  // back to the bundled sample content if the database is empty or unreachable.
  (function loadAndBuild() {
    function build() { buildCollections(); buildProductRails(); buildReviews(); buildInstagram(); CGWRender.wireReveal(); }
    if (window.CGWDB) {
      Promise.all([CGWDB.products(), CGWDB.reviews(), CGWDB.gallery()]).then(function (res) {
        if (res[0] && res[0].length) content.products = res[0];
        if (res[1] && res[1].length) content.reviews = res[1];
        if (res[2] && res[2].length) content.gallery = res[2];
      }).catch(function (e) { console.warn('CityGirl: live data unavailable, using bundled content', e); }).then(build);
    } else { build(); }
  })();

  requestAnimationFrame(function () { requestAnimationFrame(function () { document.body.classList.add('is-loaded'); }); });
</script>
</body>
</html>
